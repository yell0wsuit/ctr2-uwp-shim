; ctr2shim settings. Setup copies this file beside Game.exe once; edit it there.

[storage]
; Where the game keeps its saves:
;   game       SaveData beside Game.exe (the default)
;   documents  Documents\CutTheRope2UWP_SaveData
;   appdata    %LOCALAPPDATA%\ctr2
;   or a folder path; relative paths start beside Game.exe, and %VARIABLES% expand.
; If the folder cannot be written (for example under Program Files), saves go
; to documents, then appdata. A new location starts with a copy of the saves in
; %LOCALAPPDATA%\ctr2; the originals stay there.
SaveLocation=game
