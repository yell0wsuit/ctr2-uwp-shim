name: Publish DLL release

on:
    push:
        branches: [main]
        paths:
            - 'shim/**'
            - 'proxy/**'
            - 'cmake/**'
            - 'tests/**'
            - 'scripts/**'
            - 'CMakeLists.txt'
            - 'CMakePresets.json'
            - '.github/workflows/release.yml'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: dll-release
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: windows-latest
        timeout-minutes: 30
        defaults:
            run:
                shell: pwsh
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}

        steps:
            - name: Determine release version
              id: version
              run: |
                  $date = [DateTime]::UtcNow
                  # SemVer numeric components cannot have leading zeroes.
                  $baseTag = "v$($date.Year).$($date.Month).$($date.Day)"
                  $tags = gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[].tag_name'
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to check existing releases.' }
                  # Include tags without releases so a failed publication cannot reuse an old tag.
                  $gitTags = gh api --paginate "repos/$env:GH_REPO/tags" --jq '.[].name'
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to check existing tags.' }
                  $usedTags = @($tags) + @($gitTags)
                  $tag = $baseTag
                  $revision = 0
                  while ($tag -in $usedTags) {
                    $revision++
                    $tag = "$baseTag-$revision"
                  }
                  "tag=$tag" >> $env:GITHUB_OUTPUT
                  Write-Host "Publishing release $tag"

            - name: Check out source
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Configure x86 build
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
                  $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
                  if ($LASTEXITCODE -ne 0 -or -not $installation) {
                      throw 'No Visual Studio installation with x86 C++ tools was found.'
                  }
                  $majorVersion = ([version]$installation.installationVersion).Major
                  $capabilities = cmake -E capabilities | ConvertFrom-Json
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to query CMake generators.' }
                  $generator = $capabilities.generators.name | Where-Object { $_ -match "^Visual Studio $majorVersion " } | Select-Object -First 1
                  if (-not $generator) {
                      throw "CMake does not support installed Visual Studio version $majorVersion; update CMake on the runner."
                  }
                  Write-Host "Using $generator at $($installation.installationPath)"
                  cmake -S . -B build/release -G $generator -A Win32 "-DCMAKE_GENERATOR_INSTANCE=$($installation.installationPath)" "-DCTR2SHIM_VERSION=$env:RELEASE_TAG"
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to configure the x86 build.' }

            - name: Build
              run: cmake --build build/release --config RelWithDebInfo --parallel

            - name: Run native tests
              # GPU and media playback tests require desktop hardware unavailable on hosted runners.
              run: ctest --test-dir build/release -C RelWithDebInfo --output-on-failure --timeout 60 -E '^(gputest|mediatest)$'

            - name: Run script tests
              run: python -m unittest discover -s tests/python

            - name: Publish release
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  $assets = @(
                    'build/release/RelWithDebInfo/ctr2shim.dll'
                    'build/release/RelWithDebInfo/d3dcompiler_47.dll'
                  )
                  foreach ($asset in $assets) {
                    if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                      throw "Missing release asset: $asset"
                    }
                  }
                  $archive = "build/ctr2-uwp-shim-$env:RELEASE_TAG-x86.zip"
                  Compress-Archive -LiteralPath $assets -DestinationPath $archive -CompressionLevel Optimal -Force
                  gh release create $env:RELEASE_TAG $archive --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes --latest
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }
